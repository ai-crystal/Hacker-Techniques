<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>黑客技术与安全原理 · 三册系列</title>
  <meta name="description" content="一套讲攻防原理的中文技术书，入门篇、理论篇、实战篇。作者 Dr. Dezeming。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    :root {
      --theme-color: #0f5c5c;
      --base-font-family: "Noto Serif SC", "Songti SC", "SimSun", Georgia, serif;
      --base-font-size: 16px;
    }
    .sidebar { font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; }
    .sidebar ul li a { font-size: 13.5px; }
    .sidebar > .app-sub-sidebar { display: none; }
    .markdown-section { max-width: 800px; line-height: 1.85; }
    .markdown-section h1 { font-size: 1.9rem; letter-spacing: .02em; }
    .markdown-section h2 { font-size: 1.35rem; margin-top: 2.2em; }
    .markdown-section h3 { font-size: 1.1rem; margin-top: 1.8em; color: #0f5c5c; }
    .markdown-section p { text-align: justify; }
    .markdown-section figure { margin: 1.8em 0; text-align: center; }
    .markdown-section figure img { max-width: 100%; border-radius: 2px; }
    .markdown-section figcaption {
      font-size: .82rem; color: #6b6b70; margin-top: .7em; line-height: 1.6;
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .markdown-section table { display: table; width: 100%; font-size: .9rem; }
    .markdown-section pre { font-size: .85rem; line-height: 1.55; }
    .markdown-section code { font-family: "JetBrains Mono", Consolas, monospace; }

    section.cover {
      background: #04101c url("books/beginner/images/cover-bg.jpg") center / cover no-repeat !important;
      color: #fff; position: relative;
    }
    section.cover::before {
      content: ""; position: absolute; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 42%,
        rgba(3, 12, 22, .34) 0%, rgba(3, 12, 22, .74) 55%, rgba(3, 12, 22, .92) 100%);
    }
    section.cover .cover-main { position: relative; z-index: 1; }
    .cover-hero { text-align: center; color: #f4f8f8; }
    .cover-hero .cover-title {
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      font-size: 3.2rem; font-weight: 700; letter-spacing: .18em;
      text-indent: .18em; line-height: 1.25;
      text-shadow: 0 3px 26px rgba(0, 0, 0, .65);
    }
    .cover-hero .cover-sub {
      margin-top: 1.4rem; font-size: 1.05rem; letter-spacing: .26em;
      text-indent: .26em; color: #dfeaea;
    }
    .cover-hero .cover-tag {
      margin: 1.4rem auto 2.4rem; max-width: 32rem; font-size: .9rem;
      line-height: 1.9; color: #c3d4d4;
    }
    .cover-hero .cover-actions {
      display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap;
    }
    .cover-hero .cover-actions a {
      display: inline-block; padding: .7em 1.6em; font-size: .92rem;
      letter-spacing: .1em; text-decoration: none; border-radius: 2px;
      color: #eaf2f2; border: 1px solid rgba(230, 239, 239, .5);
      background: rgba(255, 255, 255, .06);
    }
    .cover-hero .cover-actions a:hover { background: rgba(255, 255, 255, .16); }
    .cover-hero .cover-actions a.primary {
      background: #0f5c5c; border-color: #0f5c5c; color: #fff;
    }
    .cover-hero .cover-foot {
      margin-top: 2.8rem; font-size: .78rem; letter-spacing: .12em; color: #9fb4b4;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '黑客技术与安全原理',
      loadSidebar: true,
      coverpage: true,
      onlyCover: false,
      subMaxLevel: 0,
      maxLevel: 2,
      auto2top: true,
      homepage: 'README.md',
      noCompileLinks: ['output/'],
      notFoundPage: false,
      alias: {
        '/books/beginner/.*/_sidebar.md': '/books/beginner/_sidebar.md',
        '/books/theory/.*/_sidebar.md': '/books/theory/_sidebar.md',
        '/books/practice/.*/_sidebar.md': '/books/practice/_sidebar.md'
      },
      search: {
        placeholder: '搜索全系列',
        noData: '找不到相关内容',
        paths: 'auto',
        depth: 3
      },
      pagination: {
        previousText: '上一章',
        nextText: '下一章',
        crossChapter: true
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      mermaid: { theme: 'default' },
      plugins: [
        function (hook) {
          hook.beforeEach(function (md) {
            var base = location.hash.replace(/^#\//, '').replace(/[^/]*$/, '')
                             .replace(/[^/]+\/$/, '');
            return md.replace(/\.\.\/images\//g, base + 'images/');
          });
          hook.doneEach(function () {
            document.querySelectorAll('.markdown-section a, .sidebar-nav a').forEach(function (a) {
              var h = (a.getAttribute('href') || '');
              if (/\.pdf(\.md)?$/.test(h)) {
                h = h.replace(/^#\//, '').replace(/\.md$/, '');
                a.setAttribute('href', h);
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener');
                a.addEventListener('click', function (e) { e.stopPropagation(); }, true);
              }
            });
          });
        }
      ]
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1/dist/docsify-katex.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
</body>
</html>
